# 惑星の設定（docs/spec.md 第7.2節）
# 色は仮。ドット絵ができたら実際の色に差し替える。
# outline は道案内の小アイコン（pixel-icon.html）の外枠の色。影は基本色と outline を45%混ぜた色になる。
# seed / surface / offset はフェーズ0の自動生成の仮素材用（surface: noise=まだら, bands=縞模様）。
# offset はトップでの上下のずらし量（惑星1ドット単位、0〜6。段の間隔が8ドットなので重ならない）。
# title はトップの惑星に重ねるドット絵フォントのタイトル（無ければ name）。名前が長い惑星だけ短くする。
# title_break はトップの惑星に重ねるドット絵フォントのタイトルの改行位置（| で区切る。惑星に1行で収まらないときだけ改行する）。
# intro は一覧ページの紹介文（2〜3行）。「惑星」に「ページ」とルビを振るため <ruby>惑星<rt>ページ</rt></ruby> を HTML のまま書く
# （テンプレートで HTML として出す。meta description ではルビを外す）。intro_en はその英語版（ルビなし）。
# todo: true を付けた惑星は、intro が仮の文章として表示される。
- id: illustration
  name: イラスト
  name_en: Illustration
  color: "#f3c94f"
  outline: "#935c16"   # 小アイコンの外枠（基本色と同じ色相で、明るさを約33%に。2026年11月24日）
  band: "#fdf4d6"
  bubble_thumbs: true
  seed: 11
  surface: noise
  offset: 0
  intro: ゲーム用の挿絵やライブ配信用ビジュアル、SNSアイコン、お祝いイラストなど、ご依頼と自主制作のイラストを集めた<ruby>惑星<rt>ページ</rt></ruby>です。
  intro_en: "A planet of illustrations, both commissioned and personal: art for games, livestream visuals, social media icons, celebration pieces, and more."
