  intro: ひとつひとつのドットを置いて描く、ピクセルアートの<ruby>惑星<rt>ページ</rt></ruby>です。小さな画面の中に、光や空気、季節の気配まで詰めこむことを大事にしています。ゲームブック『Flourish』のシーンも、ここから生まれました。
  intro_en: "A planet of pixel art, drawn by placing each pixel one by one. I care about fitting light, air, and even a hint of the season into a tiny canvas. The scenes of the gamebook Flourish were born here, too."
