{{ define "main" }}
<header class="title-band page-band">
  {{ partial "breadcrumbs.html" . }}
  <div class="title-band-inner">
    <h1 class="title-band-title">{{ .Title }}</h1>
  </div>
</header>
<div class="container">
  {{ .Content }}
  <ul class="page-list">
    {{- range .Pages.ByDate.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006" }}</time></li>
    {{- end }}
  </ul>
</div>
{{ end }}
