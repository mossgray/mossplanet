baseURL = "https://mossplanet.com/"
defaultContentLanguage = "ja"
title = "mossplanet"
enableRobotsTXT = true

# タグ・カテゴリーは使わない（docs/spec.md 第6.1節：絞り込みは初回は作らない）
disableKinds = ["taxonomy", "term"]

[params]
  description = "モス（mossgray）のイラスト・ドット絵・ゲームブックなどの作品を公開しています。"
  author = "モス / mossgray"
  twitter = "https://x.com/mossgray_"
  youtube = "https://www.youtube.com/@mossgray_"
  skeb = "https://skeb.jp/@mossgray_"
  booth = "https://mossplanet.booth.pm/"

  # 作品に tools（使用ツール）の指定がないときに表示する初期値（docs/spec.md 第7.1節）
  default_tools = "ラフ：Procreate／作画・仕上げ：CLIP STUDIO PAINT"

  # 惑星を公開する最低作品数。これ未満の惑星は本番で非表示（一覧ページも作らない）。
  # 確認用URL（本番以外）では件数に関係なくすべて表示し、「準備中」と出す。
  min_works = 1

  # ファンアートエリア（/fanart/）を公開するか。false にすると /fanart/ 以下を出力せず、トップの惑星も消える（第6.5節）
  fanart_public = true

  # 依頼の受付状況。true で「受付中／OPEN」、false で「停止中／CLOSED」の看板を出す（第6.4節）
  contact_open = true

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      # 1行だけの画像を <p> で囲まない（render-image.html で <figure> にするため）
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.renderer]
      unsafe = true

# 仮の文章（todo）の検査で、Netlify の CONTEXT（production / branch-deploy など）を読むため
[security.funcs]
  getenv = ["^HUGO_", "^CI$", "^CONTEXT$"]

# Netlify の _headers を出力する（確認用URLで X-Robots-Tag: noindex を付けるため）
[mediaTypes."text/netlify"]
  suffixes = [""]

[outputFormats.headers]
  mediaType = "text/netlify"
  baseName = "_headers"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "headers"]

# 日本語が主、英語は海外からの依頼の受け入れ口（docs/spec.md 第6.6節）
# 英語版はトップ・About・人工衛星だけ（ファイル名に .en を付けたもの：_index.en.md など）
# ※ TOML では表（[...]）の後ろの項目はその表に入るので、この表は必ずファイルの最後に置く
[languages]
  [languages.ja]
    weight = 1
    label = "日本語"
    locale = "ja"
  [languages.en]
    weight = 2
    label = "English"
    locale = "en"
    [languages.en.params]
      description = "Portfolio of mossgray: character illustration, pixel art, gamebooks and Live2D models."
